[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steadyhand-signal"
version = "0.1.0"
description = "Pure Python sensor signal processing and motion analysis for SteadyHand"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Dedeepya", email = "dedeepya@steadyhand.local" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
